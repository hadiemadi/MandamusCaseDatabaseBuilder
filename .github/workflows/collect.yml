name: Mandamus case collection

on:
  schedule:
    - cron: "13 */4 * * *"   # every 4 hours, offset from :00 to avoid GitHub's top-of-hour scheduling delays
  workflow_dispatch: {}    # allows manual "Run workflow" trigger, no code needed

permissions:
  contents: write   # needed for the final "commit data back to the repo" step

concurrency:
  group: mandamus-collection
  cancel-in-progress: false   # queue, don't kill an in-progress run's collected data

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit + integration tests before touching the real API
        run: |
          python tests/test_extraction.py
          python tests/test_collector_integration.py
          python tests/test_dashboard.py
          python tests/test_opinion_fetcher.py

      # Runs BEFORE the collector deliberately. Both share one daily request
      # budget (SPEC.md section 8), and a curated seed opinion is worth more
      # than another arbitrary discovered docket, so the seed gets first claim.
      # Once all seed cases resolve, this becomes a no-op and the collector
      # gets the whole budget back.
      - name: Fetch free full-text opinions for seed cases
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/opinion_fetcher.py

      - name: Run collector
        if: always()
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/collector.py

      - name: Build dashboard
        if: always()
        run: python scripts/dashboard.py

      - name: Upload results to Google Drive
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/drive_uploader.py

      - name: Commit data back to the repo
        if: always()
        run: |
          git config user.name "mandamus-collector-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Automated data collection run"
          git pull --rebase origin main
          git push
