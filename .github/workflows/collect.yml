name: Mandamus case collection

on:
  schedule:
    - cron: "13 */4 * * *"   # every 4 hours, offset from :00 to avoid GitHub's top-of-hour scheduling delays
  workflow_dispatch: {}    # allows manual "Run workflow" trigger, no code needed

permissions:
  contents: read   # SPEC.md section 16 (2026-08-11): the run no longer commits
    # data back to the repo -- Drive is the durable store now, not git -- so
    # this only ever needs to read the code, never write to the repo.

concurrency:
  group: mandamus-collection
  cancel-in-progress: false   # queue, don't kill an in-progress run's collected data

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit + integration tests before touching the real API
        run: |
          python tests/test_extraction.py
          python tests/test_collector_integration.py
          python tests/test_dashboard.py
          python tests/test_opinion_fetcher.py
          python tests/test_drive_uploader.py
          python tests/test_drive_downloader.py

      # SPEC.md section 16 (2026-08-11): data/ is no longer committed to git
      # between runs, so this ephemeral checkout starts with none of the
      # previous run's state. Pull it down from Drive first -- cases.json,
      # checkpoint.json, etc. -- so the collector resumes instead of
      # silently restarting from empty every 4 hours.
      - name: Download state from Google Drive
        continue-on-error: true  # a fresh Drive folder (first run ever) has
          # nothing to download yet; every downstream script already treats
          # a missing file as "start from empty" (see collector.py's
          # load_checkpoint/load_json calls), so this must never block the run.
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/drive_downloader.py

      # Runs BEFORE the collector deliberately. Both share one daily request
      # budget (SPEC.md section 8), and a curated seed opinion is worth more
      # than another arbitrary discovered docket, so the seed gets first claim.
      # Once all seed cases resolve, this becomes a no-op and the collector
      # gets the whole budget back.
      - name: Fetch free full-text opinions for seed cases
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/opinion_fetcher.py

      - name: Run collector
        if: always()
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/collector.py

      - name: Build dashboard
        if: always()
        run: python scripts/dashboard.py

      - name: Upload results to Google Drive
        if: always()
        continue-on-error: true  # a Drive hiccup (e.g. the service-account
          # storageQuotaExceeded issue, SPEC.md section 13) must never fail
          # the whole run. This step matters more than it used to, though --
          # SPEC.md section 16: Drive is now the durable store, not a
          # convenience copy, since data/ is no longer committed to git.
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/drive_uploader.py
